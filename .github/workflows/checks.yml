name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Core ${{ matrix.core }} / pymodbus ${{ matrix.pymodbus }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2026.10.4"
            pymodbus: "3.10.0"
            requirements: requirements_legacy_test.txt
          - core: "2026.11.2"
            pymodbus: "3.16.2"
            requirements: requirements_dev.txt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install -r "${{ matrix.requirements }}"
          python -m pip install "pymodbus==${{ matrix.pymodbus }}"
      - name: Run tests
        run: pytest --cov=custom_components.anker_solix_extras --cov-report=term-missing
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
